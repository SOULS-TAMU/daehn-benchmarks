name: Repository checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repository:
    name: Repository / ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check code, input data and preserved artifacts
        run: python -m unittest discover -s tests -v
      - name: Stage saved models
        run: python prepare_models.py
      - name: Verify repeated setup preserves working models
        run: python prepare_models.py
